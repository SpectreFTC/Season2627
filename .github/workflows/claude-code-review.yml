name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude PR Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Skip review if required tokens are missing
        if: env.CLAUDE_CODE_OAUTH_TOKEN == '' || env.GITHUB_TOKEN == ''
        shell: bash
        run: |
          echo "Required token(s) missing; skipping Claude review."
          exit 0

      - name: Run Claude code review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.GITHUB_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request for bugs, edge cases, and maintainability issues.
            Keep feedback concise, actionable, and specific to the current change.
            Post your findings as a PR review comment.
